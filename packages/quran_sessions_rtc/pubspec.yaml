name: quran_sessions_rtc
resolution: workspace
description: >
  RTC shared utilities for Quran Sessions — permission gate and call-surface
  labels. Native Agora/LiveKit implementations live in quran_sessions_rtc_sdk.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  permission_handler: ^13.0.0
  quran_sessions:
    path: ../quran_sessions

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  checks: ^0.3.0
  permission_handler_platform_interface: ^4.3.0

flutter:
  uses-material-design: true
